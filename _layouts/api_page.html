---
layout: default
---
<article class="post">
  <div class="nav-back"><a href="{{ 'api' | relative_url }}">Back</a></div>

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="assembly-version">AssemblyVersion: {{ page.assembly_version }}</div>
  
  <p>
    <a href="{{ 'search?q=' | append: page.title | relative_url }}">References to {{ page.title }}</a>
  </p>
  
  <p>
    <!-- Swagger UI tag deep-link format is #/<tag> when deepLinking is enabled. -->
    See: <a href="https://api.trestechnologies.com/swagger/index.html#/{{ page.title | uri_escape }}">Swagger</a>
  </p>

  <div class="nav-back"><a href="{{ 'api' | relative_url }}">Back</a></div>
</article>
