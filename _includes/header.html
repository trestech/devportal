<header class="site-header" role="banner">
  <div class="wrapper header-bar">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/tres_logo-main.png' | relative_url }}" alt="Tres Technologies" />
      <span>Developer Portal</span>
    </a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Primary">
        <a class="page-link" href="{{ '/api' | relative_url }}">API</a>
        <a class="page-link" href="{{ '/about' | relative_url }}">About</a>
      </nav>

      <form class="site-search" action="{{ '/search/' | relative_url }}" method="get" role="search">
        <label class="sr-only" for="search-input">Search docs</label>
        <input type="search" name="q" id="search-input" placeholder="Search docs" />
        <button type="submit">Search</button>
      </form>
    </div>
  </div>
</header>
